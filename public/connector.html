<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trello Power-Up Connector</title>
    <!-- Official Trello Power-Up Client Library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script>
      // Dedicated Trello Power-Up connector capability initialization (Zero Auth)
      window.TrelloPowerUp.initialize({
        'board-buttons': function (t) {
          return [
            {
              icon: {
                dark: 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/search.svg',
                light: 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/search.svg'
              },
              text: 'Smart Search',
              callback: function (tContext) {
                return tContext.modal({
                  title: 'Search Board Cards',
                  url: './index.html',
                  height: 680,
                  fullscreen: false
                });
              }
            }
          ];
        },
        'card-buttons': function (t) {
          return [
            {
              icon: 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/search.svg',
              text: 'Smart Search',
              callback: function (tContext) {
                return tContext.modal({
                  title: 'Search Board Cards',
                  url: './index.html',
                  height: 680,
                  fullscreen: false
                });
              }
            }
          ];
        },
        'card-badges': function (t) {
          return [];
        },
        'card-detail-badges': function (t) {
          return [];
        }
      });
    </script>
  </head>
  <body></body>
</html>
