<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trello Power-Up Connector</title>
    <!-- Official Trello Power-Up Client Library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script>
      window.TrelloPowerUp.initialize({
        'board-buttons': function (t) {
          return [
            {
              icon: {
                dark: window.location.origin + '/icons/search-dark.svg',
                light: window.location.origin + '/icons/search-light.svg'
              },
              text: 'Pinpoint',
              callback: function (tContext) {
                return tContext.modal({
                  title: 'Pinpoint — Smart Search',
                  url: window.location.origin + '/index.html',
                  height: 680,
                  fullscreen: false
                });
              }
            }
          ];
        },
        'card-buttons': function (t) {
          return [];
        },
        'card-badges': function (t) {
          return [];
        },
        'card-detail-badges': function (t) {
          return [];
        }
      });
    </script>
  </head>
  <body></body>
</html>
