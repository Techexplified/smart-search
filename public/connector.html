<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trello Power-Up Connector</title>
    <!-- Official Trello Power-Up Client Library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script>
      // Dedicated Trello Power-Up connector capability initialization
      window.TrelloPowerUp.initialize({
        'board-buttons': function (t) {
          return [
            {
              icon: {
                dark: 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/search.svg',
                light: 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/search.svg'
              },
              text: 'Smart Search',
              callback: function (tContext) {
                return tContext.modal({
                  title: 'Search Workspace Cards',
                  url: './index.html',
                  height: 680,
                  fullscreen: false
                });
              }
            }
          ];
        },
        'card-buttons': function (t) {
          return [
            {
              icon: 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/search.svg',
              text: 'Smart Search',
              callback: function (tContext) {
                return tContext.modal({
                  title: 'Search Workspace Cards',
                  url: './index.html',
                  height: 680,
                  fullscreen: false
                });
              }
            }
          ];
        },
        'show-authorization': function (t) {
          return t.popup({
            title: 'Authorization Required',
            url: './index.html',
            height: 380
          });
        }
      });
    </script>
  </head>
  <body></body>
</html>
